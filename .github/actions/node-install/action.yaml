name: "Setup mise-managed Node.js and pnpm"
description: "Resolve Node.js and pnpm from mise.toml and install them for CI"

runs:
  using: "composite"
  steps:
    - name: "Setup mise"
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        install: false
        cache: true
    - name: "Resolve Node.js and pnpm versions"
      id: versions
      shell: bash
      run: |
        echo "node=$(mise config get tools.node --file mise.toml)" >> "$GITHUB_OUTPUT"
        echo "pnpm=$(mise config get tools.pnpm --file mise.toml)" >> "$GITHUB_OUTPUT"
    - name: "Setup pnpm"
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: "${{ steps.versions.outputs.pnpm }}"
    - name: "Install locked Node.js"
      shell: bash
      run: MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES=none mise --locked install node
    - name: "Setup Node.js"
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "${{ steps.versions.outputs.node }}"
        cache: pnpm
