version: 2

updates:

  - package-ecosystem: "docker"
    directories:
      - "/*"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "CCM-9336: "
    groups:
      patch-and-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        patterns:
          - "*"
        update-types:
          - "major"
    cooldown:
      default-days: 7

